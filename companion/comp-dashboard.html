<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nectar Comp Dashboard</title>
<style>
  body { margin: 0; background: #e8edf3; color: #1a1a1a; font-family: Tahoma, Verdana, sans-serif; font-size: 12px; }
  #topbar { background: linear-gradient(#3a6ea5, #2456a6 45%, #1e4b8f); color: #fff; padding: 10px 16px; border-bottom: 2px solid #16386b; }
  #topbar b { font-size: 15px; }
  #topbar .sub { font-size: 11px; color: #cfe0f5; margin-top: 2px; }
  #tabs { background: #d4dbe4; border-bottom: 1px solid #9aa5b1; padding: 6px 12px 0; display: flex; gap: 4px; }
  #tabs button { background: #b9c4d0; border: 1px solid #9aa5b1; border-bottom: 0; border-radius: 6px 6px 0 0; padding: 7px 18px; font-family: inherit; font-size: 12px; font-weight: bold; color: #33404e; cursor: pointer; }
  #tabs button.on { background: #fff; color: #16386b; }
  #tabs button:disabled { opacity: .5; cursor: not-allowed; }
  #wrap { max-width: 980px; margin: 0 auto; padding: 14px; }
  fieldset { border: 1px solid #9aa5b1; border-radius: 4px; background: #fff; padding: 12px 14px; margin: 0 0 12px; }
  legend { font-weight: bold; color: #16386b; padding: 0 6px; font-size: 12px; }
  input, select { font-family: inherit; font-size: 12px; border: 1px solid #7f9db9; border-radius: 2px; padding: 5px 7px; color: #1a1a1a; background: #fff; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid #2456a6; outline-offset: 1px; }
  button, .btn { font-family: inherit; font-size: 12px; border: 1px solid #6b7683; border-radius: 3px; padding: 5px 12px; cursor: pointer;
    background: linear-gradient(#ffffff, #d4dbe4); color: #1a1a1a; }
  button:hover:not(:disabled) { background: linear-gradient(#ffffff, #c2cdd9); }
  button.primary { background: linear-gradient(#4a86c8, #2456a6); color: #fff; border-color: #16386b; font-weight: bold; }
  button.primary:hover:not(:disabled) { background: linear-gradient(#3a76b8, #1e4b8f); }
  button.danger { background: linear-gradient(#c0392b, #96281b); color: #fff; border-color: #6e1b12; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .gap { margin: 6px 0; }
  .rowline { margin: 5px 0; }
  table.grid { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.grid th { background: linear-gradient(#4a86c8, #2456a6); color: #fff; padding: 6px; text-align: left; font-weight: bold; }
  table.grid td { padding: 5px 6px; border-bottom: 1px solid #d4dbe4; }
  table.grid tr:nth-child(even) td { background: #f2f5f9; }
  .ok { color: #1e7e34; } .bad { color: #B42318; } .dim { color: #5b6770; }
  .muted { color: #5b6770; font-size: 11px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 9px; font-size: 11px; font-weight: bold; }
  .pill.run { background: #dff0d8; color: #1e7e34; border: 1px solid #1e7e34; }
  .pill.sched { background: #fef3d8; color: #8a6d00; border: 1px solid #8a6d00; }
  .pill.end { background: #e8edf3; color: #5b6770; border: 1px solid #9aa5b1; }
  #log { font-family: Consolas, monospace; font-size: 11px; max-height: 150px; overflow: auto; background: #fff; }
  #log div { margin: 1px 0; border-bottom: 1px dotted #d4dbe4; padding: 1px 0; }
  .tlink { color: #2456a6; text-decoration: underline; cursor: pointer; }
  .mlink { color: #2456a6; text-decoration: underline; cursor: pointer; }
  .mlink.sel { font-weight: bold; text-decoration: none; color: #16386b; background: #dbe7f5; border-radius: 3px; padding: 0 4px; }
  .cols { display: flex; gap: 12px; align-items: flex-start; }
  .cols > fieldset { flex: 1; min-width: 260px; }
  .feed { font-family: Consolas, monospace; font-size: 11px; max-height: 420px; overflow: auto; background: #f7fafc; border: 1px solid #d4dbe4; border-radius: 3px; padding: 6px 8px; }
  .feed div { margin: 2px 0; border-bottom: 1px dotted #d4dbe4; padding: 1px 0; }
  .feed .tm { color: #5b6770; }
  .placebtn { padding: 3px 7px; font-size: 11px; margin-right: 3px; }
  @media (max-width: 700px) { #wrap { padding: 8px; } fieldset { padding: 8px; } .cols { flex-direction: column; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="topbar" role="banner">
  <b>Nectar Comp Dashboard</b>
  <div class="sub">host console · loopback only · <span id="live">●</span>
    &nbsp; Server <input id="srv" size="24" value="http://127.0.0.1:8000">
    <button id="srvSave">Apply</button>
    <button id="refreshNow" title="Manual refresh (no full reload)">⟳ Refresh</button>
  </div>
</div>
<div id="tabs" role="tablist" aria-label="Dashboard sections">
  <button id="tab-status" class="on" role="tab" aria-selected="true">Status</button>
  <button id="tab-tourneys" role="tab" aria-selected="false">Tourneys</button>
  <button id="tab-log" role="tab" aria-selected="false">Log</button>
</div>
<div id="wrap">
  <div id="pane-status" role="tabpanel">
    <fieldset><legend>Live tracker -this box</legend><div id="tracker">…</div>
      <div class="rowline">Tourney #
        <input id="tSet" size="6" placeholder="0">
        <button id="tSetGo">Track</button>
        <button id="mOpen">Open match</button>
        <button id="mSeal">Seal match</button>
      </div>
    </fieldset>
  </div>
  <div id="pane-tourneys" role="tabpanel" hidden>
    <fieldset><legend>Tourneys</legend><div id="tlist">…</div></fieldset>
    <fieldset><legend>Detail</legend><div id="detail"><span class="dim">Pick a tourney.</span></div></fieldset>
  </div>
  <div id="pane-log" role="tabpanel" hidden>
    <fieldset><legend>Log</legend><div id="log" aria-live="polite"></div></fieldset>
  </div>
</div>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? '—' : v).replace(/</g, '&lt;');
// Same-origin by default (this Python server, any port); override via the
// Server box above if the API lives elsewhere.
let SRV = localStorage.getItem('comp_server') || 'http://127.0.0.1:8000';

// Which Discord server this board is looking at.
// One bot now serves several servers, so the same API holds tournaments
// belonging to different communities. Without a guild the list would mix them
// together and a host could open somebody else's event by accident.
// Order of preference: ?guild_id= in the URL (the link the bot hands out),
// then the last one used in this browser, then nothing - which the API reads
// as "no filter" and preserves the old single-server behaviour.
let GUILD_ID = null;
try {
  const fromUrl = new URLSearchParams(location.search).get('guild_id');
  if (fromUrl && /^\d+$/.test(fromUrl)) {
    GUILD_ID = fromUrl;
    localStorage.setItem('comp_guild_id', fromUrl);
  } else {
    const savedG = localStorage.getItem('comp_guild_id');
    if (savedG && /^\d+$/.test(savedG)) GUILD_ID = savedG;
  }
} catch {}
function guildQS() {
  return GUILD_ID ? '&guild_id=' + encodeURIComponent(GUILD_ID) : '';
}

let selTid = null;
try {
  // getItem returns null when missing -Number(null) is 0, which would
  // wrongly select tourney #0. (Tourney ids can start at 0, so only null
  // is rejected here; a stale non-listed id is re-selected in refreshList.)
  const savedRaw = localStorage.getItem('comp_sel_tid');
  const saved = savedRaw == null ? NaN : Number(savedRaw);
  if (Number.isFinite(saved)) selTid = saved;
} catch {}
let editMatchId = null;
let _matchLive = false;
// optimistic caches: tourney payload + match payload. Mutations patch the
// caches and re-render narrowly, then reconcile with one fetch. A full
// refreshDetail rebuild only happens on tourney switch, never per click.
let detailCache = null;
let matchCache = null;
let rosterCache = [];
let namesCache = {};
let _shellTid = null;
try {
  // getItem returns null when missing -Number(null) is 0, which is never a
  // valid match id (identity starts at 1) and would 404 as ?id=0.
  const savedMRaw = localStorage.getItem('comp_sel_match');
  const savedM = savedMRaw == null ? NaN : Number(savedMRaw);
  if (Number.isFinite(savedM) && savedM > 0) editMatchId = savedM;
  else localStorage.removeItem('comp_sel_match');
} catch {}
function persistMatch() {
  try {
    if (editMatchId == null) localStorage.removeItem('comp_sel_match');
    else localStorage.setItem('comp_sel_match', String(editMatchId));
  } catch {}
}
function log(m, err) {
  const el = $('log');
  if (!el) return;
  const d = document.createElement('div');
  if (err) d.className = 'bad';
  d.textContent = new Date().toLocaleTimeString() + ' ' + m;
  el.prepend(d);
  while (el.children.length > 60) el.lastChild.remove();
}
async function api(path, opts) {
  const r = await fetch(SRV.replace(/\/$/, '') + path, opts);
  const t = await r.text();
  let j = null;
  try { j = t ? JSON.parse(t) : null; } catch {}
  if (!r.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
  return j;
}
async function local(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}),
  });
  const t = await r.text();
  let j = null;
  try { j = t ? JSON.parse(t) : null; } catch {}
  if (!r.ok) throw new Error((j && (j.error || JSON.stringify(j))) || ('HTTP ' + r.status));
  return j;
}
function post(body) {
  return { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body == null ? {} : body) };
}
function showTab(which) {
  ['status', 'tourneys', 'log'].forEach((k) => {
    $('pane-' + k).hidden = (k !== which);
    const b = $('tab-' + k);
    b.className = (k === which) ? 'on' : '';
    b.setAttribute('aria-selected', k === which ? 'true' : 'false');
  });
}
$('tab-status').onclick = () => showTab('status');
$('tab-tourneys').onclick = () => showTab('tourneys');
$('tab-log').onclick = () => showTab('log');
function refreshButtons() {
  // Open/Seal stay clickable: with no live match the handlers log what is
  // missing instead of leaving a greyed-out button with no explanation.
  try {
    const sealBtn = $('mSeal');
    if (sealBtn) sealBtn.disabled = false;
    const openBtn = $('mOpen');
    if (openBtn) openBtn.disabled = false;
  } catch {}
}
// Node decryptor GET /comp/status shape (this file is served by the
// decryptor on :8765; the Tourneys tab talks to SRV = the Python API).
async function refreshTracker() {
  try {
    const j = await local('/comp/status');
    const c = (j && j.comp) || {};
    const live = $('live');
    live.textContent = c.enabled ? '● live' : '● off';
    live.style.color = c.enabled ? '#1e7e34' : '#999';
    const o = c.open;
    window._trackerOpen = !!o;
    $('tracker').innerHTML =
      `<table class="grid"><tr><th>Tourney</th><th>Match</th><th>Events</th><th>Room</th></tr>` +
      `<tr><td>${c.tourneyId != null ? '#' + esc(c.tourneyId) + (c.tourneyCode ? ' · ' + esc(c.tourneyCode) : '') : '—'}</td>` +
      `<td>${o ? 'v' + o.version + (o.manual ? ' (manual)' : '') : '—'}</td>` +
      `<td>${o ? o.events : 0}</td><td>${esc(c.room || '—')}</td></tr></table>` +
      `<div class="dim" style="margin-top:4px">sealed ${c.sealed || 0} · buffered ${c.buffered || 0} · dropped ${c.dropped || 0} · roster ${c.roster || 0}</div>`;
    refreshButtons();
  } catch (e) { log('tracker: ' + e.message, true); }
}
async function refreshList() {
  try {
    const j = await api('/api/comp/tourneys?' + (GUILD_ID ? 'guild_id=' + encodeURIComponent(GUILD_ID) : ''));
    const cls = { created: 'sched', scheduled: 'sched', running: 'run', ended: 'end' };
    $('tlist').innerHTML = ((j && j.tourneys) || []).map((t) =>
      `<div><span class="tlink" data-t="${t.id}"><b>#${t.id} ${esc(t.name)}</b></span> ` +
      `<span class="pill ${cls[t.status] || 'end'}">${esc(t.status)}</span> ` +
      `<span class="dim">${t.sealed || 0}/${t.series_len || '∞'} · ${t.players || 0} players</span></div>`
    ).join('') || '<span class="dim">None yet -create one with /tourney-create.</span>';
    // auto-select: keep the saved tourney if still listed, else pick the
    // newest non-ended one so Save/Calculate never fire with no selection.
    try {
      const ids = ((j && j.tourneys) || []).map((t) => Number(t.id)).filter(Number.isFinite);
      if (!ids.includes(Number(selTid))) {
        const open = ((j && j.tourneys) || []).find((t) => t.status !== 'ended');
        selTid = open ? Number(open.id) : (ids.length ? ids[0] : null);
        try {
          if (selTid == null) localStorage.removeItem('comp_sel_tid');
          else localStorage.setItem('comp_sel_tid', String(selTid));
        } catch {}
        editMatchId = null; _matchLive = false;
        persistMatch();
        if (selTid != null) refreshDetail();
      }
    } catch {}
    $('tlist').querySelectorAll('[data-t]').forEach((el) => {
      const go = () => {
        const _id = Number(el.dataset.t);
        if (!Number.isFinite(_id)) { log('bad tourney id', true); return; }
        selTid = _id; editMatchId = null; _matchLive = false;
        persistMatch();
        try { localStorage.setItem('comp_sel_tid', String(selTid)); } catch {}
        refreshList(); refreshDetail();
      };
      el.onclick = go;
      el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
      el.setAttribute('tabindex', '0');
      el.setAttribute('role', 'button');
    });
  } catch (e) { log('list: ' + e.message, true); }
}
async function refreshDetail() {
  const box = $('detail');
  if (selTid == null) { box.innerHTML = '<span class="dim">Pick a tourney.</span>'; _shellTid = null; detailCache = null; return; }
  try {
    const j = await api('/api/comp/tourney?id=' + encodeURIComponent(selTid) + guildQS());
    detailCache = j;
    const t = j.tourney || {};
    const table = t.points_table || {};
    const place = table.placement || [10, 7, 5, 3, 1];
    const matches = j.matches || [];
    if (editMatchId == null && matches.length) {
      const open = matches.find((m) => m.status === 'open' || m.status === 'manual');
      editMatchId = (open || matches[matches.length - 1]).id;
      persistMatch();
    }
    // build-once shell per tourney: inputs keep host edits across fills,
    // table buttons are wired once. Fills below never rebuild the shell.
    if (_shellTid !== selTid) {
      box.innerHTML =
        `<div id="thead"></div>` +
        `<fieldset style="margin-top:8px"><legend>Hosts</legend><div id="hosts">…</div></fieldset>` +
        `<fieldset style="margin-top:8px"><legend>Placement points</legend><div>` +
        ['1st', '2nd', '3rd', '4th', '5th'].map((lbl, i) =>
          `<label style="margin-right:8px">${lbl}<input size="3" id="tbP${i + 1}" inputmode="numeric" value="${place[i] != null ? place[i] : ''}" style="margin-left:3px"></label>`).join('') +
        `</div><div style="margin-top:6px"><label>kill <input id="tbK" size="3" inputmode="numeric" value="${table.kill != null ? table.kill : 1}"></label> ` +
        `<label>win <input id="tbW" size="3" inputmode="numeric" value="${table.win != null ? table.win : 3}"></label> ` +
        `<button id="tbSave">Save table</button> <button id="calc" class="primary">Calculate</button> <button id="dmOpen">Open blank match</button></div></fieldset>` +
        `<fieldset style="margin-top:8px"><legend>Standings</legend><div id="board">…</div></fieldset>` +
        `<fieldset style="margin-top:8px"><legend>Matches -pick one</legend><div id="matchlist">…</div></fieldset>` +
        `<div class="cols" style="margin-top:8px">` +
        `<fieldset><legend id="mLeftLeg">Match</legend><div id="matchLeft"><span class="dim">Pick a match above.</span></div></fieldset>` +
        `<fieldset><legend>Killfeed</legend><div id="matchFeed" class="feed"><span class="dim">Pick a match above.</span></div></fieldset>` +
        `</div>` +
        `<fieldset style="margin-top:8px"><legend>Unmapped names -link to players</legend><div id="unmapped">…</div></fieldset>` +
        `<fieldset style="margin-top:8px"><legend>Players &amp; banned</legend><div id="regs">…</div></fieldset>`;
      wireTableButtons();
      _shellTid = selTid;
    }
    renderHead(j);
    renderBoard(j);
    wireMatchList(matches);
    await refreshMatch();
    await renderHosts(j);
    await refreshUnmapped(j);
    await refreshRegs(j);
  } catch (e) { box.innerHTML = '<span class="bad">Failed: ' + esc(e.message) + '</span>'; _shellTid = null; }
}
function scoringHtml(table) {
  // Read-only scoring readout (1st = X pts … KILL = X pts · WIN = X pts).
  // Editing still happens in Placement points below; this just mirrors it.
  try {
    const t = table || {};
    const place = t.placement || [10, 7, 5, 3, 1];
    const parts = place.map((p, i) => ord(i + 1) + ' = ' + p + ' pts');
    parts.push('KILL = ' + (t.kill != null ? t.kill : 1) + ' pts');
    parts.push('WIN = ' + (t.win != null ? t.win : 3) + ' pts');
    return `<div class="dim" style="margin-top:3px">SCORING · ${parts.map(esc).join(' · ')}</div>`;
  } catch { return ''; }
}
function renderHead(j) {
  const el = $('thead');
  if (!el) return;
  const t = (j && j.tourney) || {};
  el.innerHTML = `<b style="font-size:14px">#${t.id} ${esc(t.name)}</b> ` +
    `<span class="dim">${esc(t.status)}${t.mode && t.mode !== 'solo' ? ' · ' + esc(t.mode) : ''} · series ${t.sealed || 0}/${t.series_len || '∞'} · code ${esc(t.code || '—')}</span>` +
    scoringHtml(t.points_table);
}
function renderBoard(j) {
  const el = $('board');
  if (!el) return;
  const bd = ((j && j.standings) || []).map((r, i) =>
    `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${r.points}</td><td>${r.kills}</td><td>${r.wins}</td><td>${r.avg_placement != null ? r.avg_placement : '—'}</td></tr>`).join('');
  el.innerHTML = bd ? `<table class="grid"><tr><th>#</th><th>Player</th><th>Pts</th><th>K</th><th>W</th><th>Avg</th></tr>${bd}</table>` : '<span class="dim">No sealed matches.</span>';
}
// Hosts panel: host-playing toggle + add/remove, optimistic with lite
// rollback on failure. The creator always hosts (even if unlisted).
async function renderHosts(j) {
  const box = $('hosts');
  if (!box || selTid == null) return;
  try {
    const t = ((j || detailCache || {}).tourney) || {};
    const hp = t.host_playing !== false;
    const rawHosts = [...new Set([...((t.hosts) || []), ...(t.created_by ? [String(t.created_by)] : [])].map((x) => String(x)))].filter(Boolean);
    const pmap = {};
    (((j || detailCache || {}).players) || []).forEach((p) => { if (p.name) pmap[String(p.discord_id)] = p.name; });
    const missing = rawHosts.filter((d) => !pmap[d]);
    if (missing.length) {
      const nm = await api('/api/comp/names?ids=' + encodeURIComponent(missing.slice(0, 100).join(','))).catch(() => ({ names: {} }));
      Object.assign(pmap, (nm && nm.names) || {});
    }
    box.innerHTML =
      `<div class="gap">Host: <b>${hp ? 'Playing' : 'Hosting only'}</b> ` +
      `<button id="hpGo">${hp ? 'Switch to Hosting Only' : 'Switch to Playing'}</button></div>` +
      `<div class="muted" style="margin:4px 0 2px">HOSTS (${rawHosts.length})</div>` +
      (rawHosts.map((d) =>
        `<div><b title="${esc(d)}">${esc(pmap[d] || 'Unknown player')}</b> ` +
        `<button data-unhost="${esc(d)}">Remove</button></div>`).join('') || '<span class="dim">None listed.</span>') +
      `<div class="gap"><input size="14" id="hostAdd" placeholder="discord id"> <button id="hostAddGo">Add host</button></div>` +
      `<div class="dim">The creator always hosts, even if unlisted.</div>`;
    const flip = $('hpGo');
    if (flip) flip.onclick = async () => {
      flip.disabled = true;
      try {
        if (detailCache && detailCache.tourney) detailCache.tourney.host_playing = !hp;
        renderHosts(detailCache);
        await api('/api/comp/tourney/host-playing', post({ tourney_id: selTid, host_playing: !hp }));
        log('host status: ' + (!hp ? 'playing' : 'hosting only'));
      } catch (e) { log('host status: ' + e.message, true); refreshTourneyLite(); }
    };
    const addGo = $('hostAddGo');
    if (addGo) addGo.onclick = async () => {
      const inp = $('hostAdd');
      const did = (inp && inp.value.trim()) || '';
      if (!did) { log('add host: enter a discord id', true); return; }
      addGo.disabled = true;
      try {
        if (detailCache && detailCache.tourney) {
          const hs = new Set((((detailCache.tourney.hosts) || []).map(String)));
          hs.add(did);
          detailCache.tourney.hosts = [...hs];
        }
        renderHosts(detailCache);
        const r = await api('/api/comp/tourney/hosts', post({ tourney_id: selTid, add: did }));
        if (detailCache && detailCache.tourney) detailCache.tourney.hosts = r.hosts || detailCache.tourney.hosts;
        renderHosts(detailCache);
        log('host added ' + did.slice(0, 6));
      } catch (e) { log('add host: ' + e.message, true); refreshTourneyLite(); }
    };
    box.querySelectorAll('[data-unhost]').forEach((b) => {
      b.onclick = async () => {
        b.disabled = true;
        const did = b.dataset.unhost;
        try {
          if (detailCache && detailCache.tourney) {
            detailCache.tourney.hosts = (((detailCache.tourney.hosts) || []).map(String)).filter((h) => h !== did);
          }
          renderHosts(detailCache);
          const r = await api('/api/comp/tourney/hosts', post({ tourney_id: selTid, remove: did }));
          if (detailCache && detailCache.tourney) detailCache.tourney.hosts = r.hosts || [];
          renderHosts(detailCache);
          log('host removed ' + did.slice(0, 6));
        } catch (e) { log('remove host: ' + e.message, true); refreshTourneyLite(); }
      };
    });
  } catch (e) { box.innerHTML = '<span class="bad">Failed: ' + esc(e.message) + '</span>'; }
}
// narrow tourney refresh for table/calculate/open-match: header, standings
// and match list only. Inputs, match panel, regs and unmapped are untouched
// (no lost edits, no scroll jumps).
async function refreshTourneyLite() {
  if (selTid == null) return;
  try {
    const j = await api('/api/comp/tourney?id=' + encodeURIComponent(selTid) + guildQS());
    detailCache = j;
    // keep optimistic kill/win math honest after a table save

        m.removed_discord_ids.map((did) =>

          `<button data-addback="${esc(String(did))}">Add back</button></div>`).join('') + `</div>`

    `<div class="gap"><input size="14" list="mWinnerList" placeholder="winner name or id" id="mWinner" value="${esc(wv)}"> ` +
    `<datalist id="mWinnerList">${dlOpts}</datalist>` +
    `<button id="mWinGo">Set winner</button> ` +
    (isLive && !m.started_at ? `<button id="mStartGo" title="Stamp Match Started now">Start match</button> ` : '') +
    (canSeal ? `<button id="mSealGo" class="primary">Seal match</button> <button id="mTieGo" title="Tie top-2 at P1 (both keep full WIN)">Tie top-2</button>` : '') +

    ` <button id="mResetGo" title="Reset whole match (clears placements, awards, all event rows)">Reset match</button> <button id="mDelGo" class="danger" title="Delete this match and its events">Delete match</button></div>` +
    `<div class="gap"><input size="14" id="mAddPlayer" placeholder="name or discord id" title="Add a player (e.g. a sub) with zero stats"> ` +
    `<button id="mAddPlayerGo" title="Add the player to this match at 0 pts">Add player</button></div>` +
    `<div class="muted" style="margin:6px 0 2px">SCORE</div>` + plist;
  try { if (_fId) { const n = document.getElementById(_fId); if (n && 'value' in n) n.value = _fVal; } } catch {}
    const wgo = $('mWinGo');
    if (wgo) wgo.onclick = () => {

    const stgo = $('mStartGo');

    const apgo = $('mAddPlayerGo');

    const tgo = $('mTieGo');

      mutMatch(tgo, () => optTie(top2),

    const dgo = $('mDelGo');

    left.querySelectorAll('[data-t1]').forEach((b) => {

        const set = [...cur1];
        if (!set.length) {
          mutMatch(b, () => optTie([]),

        } else if (set.length === 1) {
          mutMatch(b, () => optTie(set),

        } else {

    left.querySelectorAll('[data-w]').forEach((b) => {

    left.querySelectorAll('[data-p]').forEach((b) => {

    left.querySelectorAll('[data-sub]').forEach((b) => {
      b.onclick = () => {
        const did = b.dataset.sub;
        let inp = null;
        try { inp = left.querySelector(`[id="sub-${did}"]`); } catch {}
        if (!inp) { try { inp = document.getElementById('sub-' + did); } catch {} }
        const pts = Number(inp && inp.value);
        if (!Number.isFinite(pts) || pts <= 0) { log('subtract: enter points > 0 first', true); return; }
        if (pts > 500) { log('subtract: capped at 500pts', true); return; }
        const tid = (detailCache && detailCache.tourney && detailCache.tourney.id) || selTid;
        if (tid == null) { log('subtract: pick a tourney first', true); return; }
        // ledger adjustment at global tourney level (stable across reconcile);
        // the reconcile fetches below show the new total.
        mutMatch(b, () => optSub(did, pts),
          () => api('/api/comp/adjust', post({ tourney_id: tid, match_id: editMatchId, discord_id: did, delta_points: -pts, reason: 'dashboard subtract' })),
          '−' + pts + 'pts ' + nameOfDid(did), true);
      };
    });
    left.querySelectorAll('[data-add]').forEach((b) => {
      b.onclick = () => {
        const did = b.dataset.add;
        let inp = null;
        try { inp = left.querySelector(`[id="add-${did}"]`); } catch {}
        if (!inp) { try { inp = document.getElementById('add-' + did); } catch {} }
        const pts = Number(inp && inp.value);
        if (!Number.isFinite(pts) || pts <= 0) { log('add points: enter points > 0 first', true); return; }
        if (pts > 500) { log('add points: capped at 500pts', true); return; }
        mutMatch(b, () => optAdd(did, pts),
          () => api('/api/comp/match/points', post({ match_id: editMatchId, discord_id: did, delta: pts })),
          '+' + pts + 'pts ' + nameOfDid(did), true);
      };
    });
    left.querySelectorAll('[data-reset]').forEach((b) => {
      b.onclick = () => {
        const did = b.dataset.reset;
        if (!confirm(`Reset ${nameOfDid(did)} in this match? Clears placement, awards and event rows.`)) return;
        mutMatch(b, () => {},
          () => api('/api/comp/match/reset', post({ match_id: editMatchId, discord_id: did, hard: true })),
          'reset ' + nameOfDid(did), true);
      };
    });
    left.querySelectorAll('[data-remove]').forEach((b) => {
      b.onclick = () => mutMatch(b, () => {},
        () => api('/api/comp/match/remove', post({ match_id: editMatchId, discord_id: b.dataset.remove })),
        'removed ' + nameOfDid(b.dataset.remove), true);
    });
    left.querySelectorAll('[data-addback]').forEach((b) => {
      b.onclick = () => mutMatch(b, () => {},
        () => api('/api/comp/match/add-back', post({ match_id: editMatchId, discord_id: b.dataset.addback })),
        'added back ' + nameOfDid(b.dataset.addback), true);
    });
    // RIGHT: killfeed
    const line = (e) => {
      const t = e.created_at ? `<span class="tm">${esc(new Date(e.created_at).toLocaleTimeString())}</span> ` : '';
      const man = e.manual ? ` <span class="dim" title="Added by hand in this dashboard">~manual</span>` : '';
      const a = `<b>${esc(e.actor_name || '?')}</b>`;
      const v = `<b>${esc(e.target_name || '?')}</b>`;
      if (e.etype === 'kill') return `<div>${t}🔪 ${a} killed ${v}${man}</div>`;
      if (e.etype === 'knock') return `<div>${t}💥 ${a} knocked ${v}${man}</div>`;
      if (e.etype === 'alv' && e.alive === false) return `<div>${t}💀 ${a} is eliminated${man}</div>`;
      if (e.etype === 'leave') return `<div>${t}🚪 ${a} left${man}</div>`;
      return '';
    };
    const bookStart = (() => { try { return m.started_at ? `<div>🟢 <b>Match Started</b> <span class="dim">${esc(new Date(m.started_at).toLocaleTimeString())}</span></div>` : ''; } catch { return ''; } })();
    const bookEnd = (() => { try { return m.sealed_at ? `<div>🏁 <b>Match Ended</b> <span class="dim">${esc(new Date(m.sealed_at).toLocaleTimeString())}</span></div>` : ''; } catch { return ''; } })();
    const isKill = (e) => e.etype === 'kill' || e.etype === 'knock';
    const isLeave = (e) => e.etype === 'leave';
    const isAlv = (e) => e.etype === 'alv' && e.alive === false;
    const sec = (title, rows, bookTop, bookBottom) =>
      `<div class="muted" style="margin:6px 0 2px">${title} (${rows.length})</div>` + (bookTop || '') +
      (rows.length ? rows.map(line).join('') : '<span class="dim">—</span>') + (bookBottom || '');
    feed.innerHTML = sec('🔪 KILLS', kills.filter(isKill), bookStart, '') + sec('🚪 LEAVES', kills.filter(isLeave), '', '') + sec('💀 ELIMINATIONS', kills.filter(isAlv), '', bookEnd) || '<span class="dim">No events yet.</span>';
    try { feed.scrollTop = sc; } catch {}
}
function wireMatchList(matches) {
  const box = $('matchlist');
  if (!box) return;
  const list = matches || [];
  if (!list.length) { box.innerHTML = '<span class="dim">None yet -play a match or open a blank one.</span>'; return; }
  // keep selection if still listed; else the live (open/manual) match, else latest
  if (!list.some((m) => m.id === editMatchId)) {
    const live = list.find((m) => m.status === 'open' || m.status === 'manual');
    editMatchId = (live || list[list.length - 1]).id;
    persistMatch();
  }
  box.innerHTML = list.map((m) => {
    const sel = m.id === editMatchId ? ' sel' : '';
    const dot = (m.status === 'open' || m.status === 'manual') ? ' 🟢' : '';
    return `<div style="margin:3px 0"><span class="mlink${sel}" data-m="${m.id}">v${m.version}${dot}</span> ` +
      `<span class="dim">${esc(m.status)}${m.room_id ? ' · ' + esc(String(m.room_id).slice(0, 8)) : ''} · winner ${esc(m.winner || '—')}</span></div>`;
  }).join('');
  box.querySelectorAll('[data-m]').forEach((el) => {
    el.onclick = () => {
      editMatchId = Number(el.dataset.m);
      persistMatch();
      wireMatchList(list);
      refreshMatch();
    };
  });
}

async function refreshUnmapped(t) {
  const box = $('unmapped');
  if (!box || selTid == null) return;
  try {
    const matches = (t && t.matches) || [];
    if (!matches.length) { box.innerHTML = '<span class="dim">No matches yet.</span>'; return; }
    const acc = await api('/api/comp/regs?tourney_id=' + encodeURIComponent(selTid) + '&status=accepted').catch(() => ({ regs: [] }));
    const roster = [...new Set(((acc && acc.regs) || []).flatMap((r) => r.member_ids || []))];
    const pmap = {};
    ((t && t.players) || []).forEach((p) => { pmap[String(p.discord_id)] = p.name; });
    // no did-prefix fallback: unknown roster members render as Unknown player.
    const normNm = (s) => { try { return String(s || '').replace(/<[^>]*>/g, '').replace(/^dc:\s*/i, '').trim().toLowerCase(); } catch { return String(s || '').toLowerCase(); } };
    // sticky mapping cache per tourney (localStorage): actor -> did survives
    // reloads + new matches. Roster-checked: stale dids (off-roster) never
    // preselect. Server apply-to-all still backfills across matches.
    const linkCache = (() => { try { return JSON.parse(localStorage.getItem('comp_links_' + selTid) || '{}'); } catch { return {}; } })();
    const rosterSet = new Set(roster.map(String));
    const cachedFor = (actor) => {
      try {
        const did = linkCache[normNm(actor)];
        return (did && rosterSet.has(String(did))) ? String(did) : null;
      } catch { return null; }
    };
    const optsFor = (actor) => {
      const cached = cachedFor(actor);
      return roster.map((d) => {
        const sel = (cached && String(d) === cached) || (!cached && normNm(pmap[d]) && normNm(pmap[d]) === normNm(actor)) ? ' selected' : '';
        return `<option value="${esc(d)}"${sel}>${esc(pmap[d] || 'Unknown player')}</option>`;
      }).join('');
    };
    const cacheLink = (actor, did) => {
      try {
        if (!actor || !did) return;
        const c = (() => { try { return JSON.parse(localStorage.getItem('comp_links_' + selTid) || '{}'); } catch { return {}; } })();
        c[normNm(actor)] = String(did);
        localStorage.setItem('comp_links_' + selTid, JSON.stringify(c));
      } catch {}
    };
    let html = '<div style="margin:4px 0"><input id="unmap-q" size="18" placeholder="filter names…"> ' +
      '<label class="dim"><input type="checkbox" id="link-all" checked> apply to all matches</label></div><div id="unmap-rows">';
    for (const m of matches) {
      const u = await api('/api/comp/match/unmapped?match_id=' + encodeURIComponent(m.id)).catch(() => null);
      const rows = ((u && u.unmapped) || []).filter((r) => (r.kills || 0) > 0 || (r.deaths || 0) > 0);
      if (!rows.length) continue;
      html += `<div style="margin:4px 0" data-ver="${m.version}"><b>v${m.version}</b> ` + rows.map((r, i) => {
        const an = String(r.name || '').replace(/"/g, '&quot;');
        return `<div data-aname="${an.toLowerCase()}">${esc(r.name)} <span class="dim">${r.kills}K/${r.deaths}D</span> ` +
        `<select id="link-${m.id}-${i}">${optsFor(r.name)}</select> ` +
        `<button data-link="${m.id}:${i}" data-aname="${an}">Link</button></div>`;
      }).join('') + `</div>`;
    }
    html += '</div>';
    box.innerHTML = html || '<span class="dim">Everything mapped.</span>';
    try {
      const q = document.querySelector('#unmap-q');
      if (q) q.oninput = () => {
        const needle = String(q.value || '').toLowerCase();
        box.querySelectorAll('[data-aname]').forEach((el) => {
          el.style.display = !needle || String(el.dataset.aname).includes(needle) ? '' : 'none';
        });
      };
    } catch {}
    box.querySelectorAll('[data-link]').forEach((b) => {
      b.onclick = async () => {
        b.disabled = true;
        try {
          const [mid, idx] = String(b.dataset.link).split(':');
          const sel = document.querySelector(`[id="link-${mid}-${idx}"]`);
          const allBox = document.querySelector('#link-all');
          const did = sel && sel.value ? sel.value : null;
          await api('/api/comp/match/link', post({
            match_id: Number(mid), actor_name: b.dataset.aname,
            discord_id: did,
            apply_to_all: !!(allBox && allBox.checked),
          }));
          cacheLink(b.dataset.aname, did);
          log('linked ' + b.dataset.aname); refreshDetail();
        } catch (e) { log('link: ' + e.message, true); b.disabled = false; }
      };
    });
  } catch (e) { box.innerHTML = '<span class="bad">Failed: ' + esc(e.message) + '</span>'; }
}
async function refreshAll() { await refreshTracker(); await refreshList(); await refreshDetail(); }
try {
  const _rn = $('refreshNow');
  if (_rn) _rn.onclick = async () => {
    _rn.disabled = true;
    try {
      await refreshTracker(); await refreshList(); await refreshDetail();
      try { if (editMatchId != null) await refreshMatch(); } catch {}
      log('refreshed');
    } catch (e) { log('refresh: ' + (e && e.message || e), true); }
    _rn.disabled = false;
  };
} catch {}
setInterval(refreshTracker, 10000);

setInterval(() => { try { if (_matchLive && selTid != null && editMatchId != null) refreshMatch(); } catch {} }, 10000);
refreshAll();
